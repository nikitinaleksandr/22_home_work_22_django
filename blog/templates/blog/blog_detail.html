{% extends 'blog/base.html' %}

{%  block content %}
<div class="album py-5 bg-body-tertiary">
    <div class="container">
      <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
        <div class="col">
          <div class="card shadow-sm">
              <div class="card-body">
              <p class="card-text">Заголовок: {{ object.name }}</p>
              <p class="card-text">Содержимое: {{ object.description }}</p>
              <p class="card-text">Превью: {{ object.image }}</p>
              <p class="card-text">Количество просмотров: {{ object.views_count }}</p>
              <p class="card-t ext">Дата создания: {{ object.create_at }}</p>
              <div class="d-flex justify-content-between align-itecreate_atms-center">
                <div class="btn-group">
                  <a class="btn btn-primary" href="{% url 'blog:blog_list' %}" role="button">Назад</a>
                </div>
                <small class="text-body-secondary">9 mins</small>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
{% endblock %}
